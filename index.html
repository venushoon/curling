<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 프로 컬링 게임 - 팀 대결 모드</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #000000 100%);
            height: 100vh;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }

        /* 홈 화면 */
        .home-container {
            width: 90%; max-width: 600px; background: white; border-radius: 30px;
            padding: 60px 25px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .home-title {
            font-size: clamp(32px, 8vw, 48px); font-weight: 900; margin-bottom: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            white-space: normal; word-break: keep-all; line-height: 1.2;
        }
        .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 40px; }
        .mode-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 40px 10px; border-radius: 20px;
            cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 20px rgba(102,126,234,0.3);
        }
        .mode-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(102,126,234,0.5); }
        .mode-card.versus { background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); }

        /* 설정 페이지 */
        .setup-container {
            width: 95vw; max-width: 1000px; max-height: 90vh;
            background: white; border-radius: 25px; padding: 30px 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow-y: auto;
        }
        .setup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 3px solid #e0e7ff; padding-bottom: 15px; gap: 10px; flex-wrap: wrap; }
        .setup-header h2 { font-size: clamp(20px, 5vw, 28px); font-weight: 900; color: #333; }
        .tournament-input-group { background: #f0f4ff; padding: 20px; border-radius: 15px; margin-bottom: 25px; border: 2px dashed #667eea; }
        .layers-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .layer-card { background: #f8f9ff; border: 1px solid #e0e7ff; border-radius: 15px; padding: 15px; position: relative; }
        .form-label { font-size: 11px; font-weight: bold; color: #667eea; display: block; margin-bottom: 5px; }
        input[type="text"], textarea { width: 100%; padding: 12px; border: 2px solid #e0e7ff; border-radius: 10px; font-family: inherit; }
        
        .preview-container { position: relative; width: 100%; height: 100px; margin-top: 10px; }
        .img-preview { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; border: 2px solid #e0e7ff; }
        .btn-delete-img { position: absolute; top: -8px; right: -8px; width: 28px; height: 28px; background: #ff4757; color: white; border: none; border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(255, 71, 87, 0.4); z-index: 5; }

        /* 게임 화면 프레임 */
        .game-wrapper {
            position: relative; height: 98vh; width: auto; background: #f0faff; 
            border-radius: 40px; box-shadow: 0 0 50px rgba(0,0,0,0.8);
            overflow: hidden; display: flex; flex-direction: column; border: 8px solid #333; 
        }
        @media (max-width: 768px) { .game-wrapper { height: 100vh; width: 100vw; border-radius: 0; border: none; } }
        canvas { flex: 1; touch-action: none; cursor: crosshair; }

        /* 배너 및 점수판 디자인 */
        .tournament-banner { position: absolute; top: 15px; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 5; pointer-events: none; gap: 5px; }
        .tournament-name { display: inline-block; padding: 5px 25px; background: rgba(255, 255, 255, 0.95); border: 2px solid #667eea; border-radius: 50px; color: #4a148c; font-weight: 900; font-size: clamp(12px, 3vw, 18px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* 팀 대결 점수판 */
        .scoreboard { background: rgba(0, 0, 0, 0.8); border: 2px solid #fff; border-radius: 10px; padding: 5px; color: white; font-size: 10px; min-width: 280px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .scoreboard table { width: 100%; border-collapse: collapse; text-align: center; }
        .scoreboard th, .scoreboard td { border: 1px solid rgba(255,255,255,0.3); padding: 2px 4px; }
        .team-red { color: #ff5252; font-weight: bold; }
        .team-blue { color: #448aff; font-weight: bold; }
        .current-turn-label { font-size: 12px; font-weight: 900; padding: 3px 15px; border-radius: 5px; margin-top: 3px; }

        /* 하단 아이콘 버튼 */
        .bottom-ui-area { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 30px; z-index: 10; pointer-events: none; }
        .btn-icon-simple { background: none; border: none; cursor: pointer; font-size: 32px; pointer-events: auto; transition: transform 0.2s; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
        .btn-icon-simple:hover { transform: scale(1.2); }
        .btn-game-text { padding: 14px 28px; border-radius: 15px; border: none; font-weight: 900; cursor: pointer; color: white; font-size: 16px; box-shadow: 0 6px 15px rgba(0,0,0,0.2); transition: all 0.2s; }

        /* 팝업 디자인 */
        .popup-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .popup-content { background: white; border-radius: 35px; padding: 40px; max-width: 480px; width: 90%; text-align: center; box-shadow: 0 30px 70px rgba(0,0,0,0.6); }
        .popup-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 15px; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 20px; box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const SoundManager = {
            ctx: null,
            init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            play(freq, duration = 0.1) {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + duration);
            },
            playCollision() { this.play(400, 0.05); },
            playHole() {
                this.init();
                [523, 659, 783].forEach((f, i) => setTimeout(() => this.play(f, 0.15), i * 100));
            }
        };

        function CurlingApp() {
            const [page, setPage] = useState('home');
            const [mode, setMode] = useState('single'); // 'single' or 'versus'
            const [tournamentTitle, setTournamentTitle] = useState('우리 반 컬링 대회');
            const [layers, setLayers] = useState(Array(6).fill(null).map((_, i) => ({
                id: i, title: `과녁 ${i + 1}`, text: `명중!`, image: ''
            })));

            const updateLayer = (idx, field, val) => {
                const next = [...layers];
                next[idx] = { ...next[idx], [field]: val };
                setLayers(next);
            };

            const startGame = (selectedMode) => {
                setMode(selectedMode);
                setPage('setup');
            };

            return (
                <div style={{width: '100%'}}>
                    {page === 'home' && <Home onStart={startGame} />}
                    {page === 'setup' && (
                        <Setup 
                            title={tournamentTitle} setTitle={setTournamentTitle}
                            layers={layers} onUpdate={updateLayer} 
                            onBack={() => setPage('home')} onPlay={() => setPage('game')} 
                        />
                    )}
                    {page === 'game' && <Game mode={mode} title={tournamentTitle} layers={layers} onExit={() => setPage('setup')} onHome={() => setPage('home')} />}
                </div>
            );
        }

        function Home({ onStart }) {
            return (
                <div className="home-container">
                    <h1 className="home-title">🎯 프로 컬링 게임</h1>
                    <p style={{color:'#666', marginBottom:'25px', fontSize:'18px'}}>실감나는 물리 엔진 컬링 대회</p>
                    <div className="mode-grid">
                        <div className="mode-card" onClick={() => onStart('single')}><h2>연습하기</h2><p style={{fontSize:'13px', marginTop:'5px'}}>혼자서 자유롭게 던지기</p></div>
                        <div className="mode-card versus" onClick={() => onStart('versus')}><h2>팀 대결</h2><p style={{fontSize:'13px', marginTop:'5px'}}>RED vs BLUE 10회 대전</p></div>
                    </div>
                </div>
            );
        }

        function Setup({ title, setTitle, layers, onUpdate, onBack, onPlay }) {
            return (
                <div className="setup-container">
                    <div className="setup-header">
                        <h2>⚙️ 대회 설정</h2>
                        <div>
                            <button className="btn-game-text" onClick={onBack} style={{background:'#667eea', marginRight:'10px'}}>홈으로</button>
                            <button className="btn-game-text" onClick={onPlay} style={{background:'#764ba2'}}>대회 시작!</button>
                        </div>
                    </div>
                    <div className="tournament-input-group">
                        <label className="form-label">🏆 대회 명칭</label>
                        <input type="text" value={title} onChange={e => setTitle(e.target.value)} style={{fontSize:'20px', fontWeight:'bold', border:'2px solid #667eea'}} />
                    </div>
                    <div className="layers-grid">
                        {layers.map((l, i) => (
                            <div key={i} className="layer-card">
                                <strong style={{color:'#667eea'}}>과녁 #{i+1}</strong>
                                <div style={{marginTop:'10px'}}><label className="form-label">이름</label><input type="text" value={l.title} onChange={e => onUpdate(i, 'title', e.target.value)} /></div>
                                <div style={{marginTop:'8px'}}><label className="form-label">이미지</label>
                                <input type="file" accept="image/*" onChange={e => {
                                    const file = e.target.files[0];
                                    if(file) {
                                        const reader = new FileReader();
                                        reader.onload = (ev) => onUpdate(i, 'image', ev.target.result);
                                        reader.readAsDataURL(file);
                                    }
                                }} />
                                {l.image && (
                                    <div className="preview-container">
                                        <img src={l.image} className="img-preview" />
                                        <button className="btn-delete-img" onClick={() => onUpdate(i, 'image', '')}>✕</button>
                                    </div>
                                )}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function Game({ mode, title, layers, onExit, onHome }) {
            const canvasRef = useRef(null);
            const wrapperRef = useRef(null);
            const [popup, setPopup] = useState(null);
            const imagesRef = useRef([]); 
            
            // 팀 대결 상태
            const [scores, setScores] = useState({ red: Array(10).fill(null), blue: Array(10).fill(null) });
            const [turn, setTurn] = useState('red');
            const [round, setRound] = useState(0); // 0~9 (총 10회)
            const [gameOver, setGameOver] = useState(false);
            const [holeValues, setHoleValues] = useState([1, 2, 3, 4, 5, 6]);

            const state = useRef({
                stone: { x: 0, y: 0, vx: 0, vy: 0, r: 22 },
                drag: { active: false, startX: 0, startY: 0, currX: 0, currY: 0 },
                holes: [], isMoving: false, canvasWidth: 0, canvasHeight: 0
            });

            // 점수 무작위 섞기 함수
            const shuffleHoles = () => {
                setHoleValues([...holeValues].sort(() => Math.random() - 0.5));
            };

            useEffect(() => {
                layers.forEach((l, i) => {
                    if (l.image) {
                        const img = new Image();
                        img.src = l.image;
                        imagesRef.current[i] = img;
                    } else { imagesRef.current[i] = null; }
                });
                if(mode === 'versus') shuffleHoles();
            }, [layers]);

            const resize = () => {
                const canvas = canvasRef.current;
                const wrapper = wrapperRef.current;
                if (!canvas || !wrapper) return;
                const h = wrapper.clientHeight;
                let w = h / 2.3;
                if (w > window.innerWidth * 0.95) w = window.innerWidth * 0.95;
                canvas.width = w; canvas.height = h;
                wrapper.style.width = `${w}px`;
                state.current.canvasWidth = w; state.current.canvasHeight = h;
                state.current.stone.x = w / 2; state.current.stone.y = h - 110;
                const newHoles = [];
                const padding = 25; const startY = 160; const colW = (w - padding * 2) / 2; const rowH = 110;
                for(let i=0; i<6; i++) {
                    const row = Math.floor(i / 2); const col = i % 2;
                    newHoles.push({ x: padding + colW / 2 + col * colW, y: startY + row * rowH, r: 36, index: i });
                }
                state.current.holes = newHoles;
            };

            const resetStone = (toStartLine = true) => {
                const s = state.current.stone; s.vx = 0; s.vy = 0;
                if(toStartLine) { s.x = state.current.canvasWidth / 2; s.y = state.current.canvasHeight - 110; }
            };

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationId;
                window.addEventListener('resize', resize);
                resize();
                const loop = () => { update(); draw(); animationId = requestAnimationFrame(loop); };
                const update = () => {
                    const s = state.current.stone; const cW = state.current.canvasWidth; const cH = state.current.canvasHeight;
                    if (state.current.isMoving) {
                        s.x += s.vx; s.y += s.vy; s.vx *= 0.985; s.vy *= 0.985;
                        if(s.x < s.r || s.x > cW - s.r) { s.vx *= -0.7; s.x = s.x < s.r ? s.r : cW - s.r; SoundManager.playCollision(); }
                        if(s.y < s.r || s.y > cH - s.r) { s.vy *= -0.7; s.y = s.y < s.r ? s.r : cH - s.r; SoundManager.playCollision(); }
                        if(Math.hypot(s.vx, s.vy) < 0.25) {
                            state.current.isMoving = false;
                            const hit = state.current.holes.find(h => Math.hypot(s.x - h.x, s.y - h.y) < h.r + s.r);
                            if(hit) {
                                SoundManager.playHole();
                                const score = holeValues[hit.index];
                                if(mode === 'versus') {
                                    const newScores = {...scores};
                                    newScores[turn][round] = score;
                                    setScores(newScores);
                                    setPopup({ ...layers[hit.index], title: `${turn.toUpperCase()} 팀 ${score}점 획득!`, text: layers[hit.index].text });
                                } else {
                                    setPopup(layers[hit.index]);
                                }
                                resetStone(false);
                            } else { resetStone(true); }
                        }
                    }
                };
                const draw = () => {
                    const cH = state.current.canvasHeight; const cW = state.current.canvasWidth;
                    ctx.clearRect(0, 0, cW, cH);
                    const grad = ctx.createLinearGradient(0,0,0, cH);
                    grad.addColorStop(0, '#e3f2fd'); grad.addColorStop(1, '#bbdefb');
                    ctx.fillStyle = grad; ctx.fillRect(0,0, cW, cH);

                    // 사이드 남은 스톤 표시 (팀 대결 모드 전용)
                    if(mode === 'versus') {
                        const redRemaining = scores.red.filter(s => s === null).length;
                        const blueRemaining = scores.blue.filter(s => s === null).length;
                        for(let i=0; i<redRemaining; i++) {
                            ctx.beginPath(); ctx.arc(15, cH - 150 - (i*15), 6, 0, Math.PI*2);
                            ctx.fillStyle = '#ff5252'; ctx.fill();
                        }
                        for(let i=0; i<blueRemaining; i++) {
                            ctx.beginPath(); ctx.arc(cW - 15, cH - 150 - (i*15), 6, 0, Math.PI*2);
                            ctx.fillStyle = '#448aff'; ctx.fill();
                        }
                    }

                    // START 구역
                    const startZoneY = cH - 150;
                    ctx.fillStyle = 'rgba(144, 202, 249, 0.3)'; ctx.fillRect(0, startZoneY, cW, 80);
                    ctx.strokeStyle = '#42a5f5'; ctx.strokeRect(0, startZoneY, cW, 80);

                    // 과녁
                    state.current.holes.forEach((h, i) => {
                        ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI*2);
                        ctx.fillStyle = '#212121'; ctx.fill();
                        ctx.strokeStyle = turn === 'red' && mode === 'versus' ? '#ff5252' : turn === 'blue' && mode === 'versus' ? '#448aff' : '#ff1744';
                        ctx.lineWidth = 5; ctx.stroke();
                        const img = imagesRef.current[i];
                        if (img && img.complete) {
                            ctx.save(); ctx.beginPath(); ctx.arc(h.x, h.y, h.r - 2, 0, Math.PI * 2); ctx.clip();
                            ctx.drawImage(img, h.x - h.r, h.y - h.r, h.r * 2, h.r * 2); ctx.restore();
                        }
                        // 점수/숫자 표시
                        ctx.fillStyle = 'white'; ctx.font = 'bold 26px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText(mode === 'versus' ? holeValues[i] : i+1, h.x, h.y);
                        // 텍스트
                        ctx.fillStyle = '#333'; ctx.font = '900 15px Sans-serif';
                        ctx.fillText(layers[i].title, h.x, h.y + h.r + 20);
                    });

                    // 스톤 (턴에 따라 색상 변경)
                    const s = state.current.stone; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
                    const sG = ctx.createRadialGradient(s.x-6, s.y-6, 0, s.x, s.y, s.r);
                    if(mode === 'versus') {
                        if(turn === 'red') { sG.addColorStop(0, '#ff8a65'); sG.addColorStop(1, '#d84315'); }
                        else { sG.addColorStop(0, '#64b5f6'); sG.addColorStop(1, '#1976d2'); }
                    } else { sG.addColorStop(0, '#ff8a65'); sG.addColorStop(1, '#d84315'); }
                    ctx.fillStyle = sG; ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

                    // 드래그 가이드
                    if(state.current.drag.active) {
                        const d = state.current.drag;
                        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(d.currX, d.currY);
                        ctx.strokeStyle = turn === 'red' ? 'rgba(255, 0, 0, 0.4)' : 'rgba(0, 0, 255, 0.4)';
                        ctx.lineWidth = 3; ctx.stroke();
                    }
                };

                const onDown = (e) => {
                    if(state.current.isMoving || popup || gameOver) return;
                    const rect = canvas.getBoundingClientRect();
                    const cx = (e.clientX || e.touches[0].clientX); const cy = (e.clientY || e.touches[0].clientY);
                    const x = (cx - rect.left) * (canvas.width / rect.width); const y = (cy - rect.top) * (canvas.height / rect.height);
                    if(Math.hypot(x - state.current.stone.x, y - state.current.stone.y) < state.current.stone.r * 2.5) {
                        state.current.drag = { active: true, startX: x, startY: y, currX: x, currY: y }; SoundManager.play(800, 0.05);
                    }
                };

                const onMove = (e) => {
                    if(!state.current.drag.active) return;
                    const rect = canvas.getBoundingClientRect();
                    const cx = (e.clientX || (e.touches ? e.touches[0].clientX : 0)); const cy = (e.clientY || (e.touches ? e.touches[0].clientY : 0));
                    state.current.drag.currX = (cx - rect.left) * (canvas.width / rect.width);
                    state.current.drag.currY = (cy - rect.top) * (canvas.height / rect.height);
                };

                const onUp = () => {
                    if(!state.current.drag.active) return;
                    const d = state.current.drag; const s = state.current.stone;
                    s.vx = (d.startX - d.currX) * 0.16; s.vy = (d.startY - d.currY) * 0.16;
                    if(Math.hypot(s.vx, s.vy) > 1.5) { state.current.isMoving = true; SoundManager.play(600, 0.2); } else resetStone(true);
                    state.current.drag.active = false;
                };

                canvas.addEventListener('mousedown', onDown); window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
                canvas.addEventListener('touchstart', onDown, { passive: false }); window.addEventListener('touchmove', onMove, { passive: false }); window.addEventListener('touchend', onUp);
                loop();
                return () => { cancelAnimationFrame(animationId); window.removeEventListener('resize', resize); };
            }, [layers, title, turn, round, holeValues, gameOver, popup]);

            const nextTurn = () => {
                setPopup(null);
                resetStone(true);
                if(mode === 'versus') {
                    if(turn === 'blue') {
                        if(round === 9) {
                            setGameOver(true);
                        } else {
                            setRound(round + 1);
                            setTurn('red');
                            shuffleHoles();
                        }
                    } else {
                        setTurn('blue');
                        shuffleHoles();
                    }
                }
            };

            const redTotal = scores.red.reduce((a, b) => a + (b || 0), 0);
            const blueTotal = scores.blue.reduce((a, b) => a + (b || 0), 0);

            return (
                <div className="game-wrapper" ref={wrapperRef}>
                    <div className="tournament-banner">
                        <div className="tournament-name">🏆 {title}</div>
                        {mode === 'versus' && (
                            <div className="scoreboard">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>TEAM</th>{Array(10).fill(0).map((_, i) => <th key={i}>{i+1}</th>)}<th>TOT</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td className="team-red">RED</td>{scores.red.map((s, i) => <td key={i}>{s}</td>)}<td className="team-red">{redTotal}</td>
                                        </tr>
                                        <tr>
                                            <td className="team-blue">BLUE</td>{scores.blue.map((s, i) => <td key={i}>{s}</td>)}<td className="team-blue">{blueTotal}</td>
                                        </tr>
                                    </tbody>
                                </table>
                                <div className="current-turn-label" style={{background: turn === 'red' ? '#ff5252' : '#448aff'}}>
                                    {turn.toUpperCase()} TURN - {round + 1}회차
                                </div>
                            </div>
                        )}
                    </div>

                    <canvas ref={canvasRef} />
                    
                    <div className="bottom-ui-area">
                        <button className="btn-icon-simple" onClick={onExit} title="설정">⚙️</button>
                        <button className="btn-icon-simple" onClick={onHome} title="홈">🏠</button>
                    </div>

                    {popup && (
                        <div className="popup-overlay">
                            <div className="popup-content">
                                <h1 style={{color: turn === 'red' ? '#ff5252' : '#448aff'}}>{popup.title}</h1>
                                {popup.image && <img src={popup.image} className="popup-image" />}
                                <p style={{margin:'15px 0', fontSize:'20px', fontWeight:'bold'}}>{popup.text}</p>
                                <button className="popup-btn" onClick={nextTurn}>다음 차례</button>
                            </div>
                        </div>
                    )}

                    {gameOver && (
                        <div className="popup-overlay">
                            <div className="popup-content">
                                <div style={{fontSize:'80px'}}>🎊</div>
                                <h1>대회 종료!</h1>
                                <h2 style={{margin:'20px 0'}}>
                                    {redTotal > blueTotal ? <span className="team-red">RED 팀 승리!</span> : redTotal < blueTotal ? <span className="team-blue">BLUE 팀 승리!</span> : "무승부!"}
                                </h2>
                                <p style={{fontSize:'24px'}}>RED {redTotal} : {blueTotal} BLUE</p>
                                <button className="popup-btn" onClick={onHome}>처음으로 돌아가기</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<CurlingApp />, document.getElementById('root'));
    </script>
</body>
</html>
