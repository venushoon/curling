<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 프로 컬링 게임 - 최적화 레이아웃</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #e0e0e0 0%, #a0a0a0 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 홈 화면 */
        .home-container {
            width: 90%; max-width: 600px;
            background: white; border-radius: 30px;
            padding: 60px 40px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .home-title {
            font-size: 48px; font-weight: 900; margin-bottom: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 40px; }
        .mode-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 40px 20px; border-radius: 20px;
            cursor: pointer; transition: all 0.3s;
        }
        .mode-card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(102,126,234,0.4); }

        /* 설정 페이지 */
        .setup-container {
            width: 95vw; max-width: 1000px; max-height: 90vh;
            background: white; border-radius: 25px; padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow-y: auto;
            animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .setup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 3px solid #e0e7ff; padding-bottom: 20px; }
        .layers-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .layer-card { background: #f8f9ff; border: 2px solid #e0e7ff; border-radius: 15px; padding: 15px; }
        .form-group { margin-bottom: 10px; }
        .form-label { font-size: 11px; font-weight: bold; color: #667eea; }
        input[type="text"], textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px; }

        /* 게임 화면 */
        .game-wrapper {
            position: relative;
            height: 95vh;
            width: auto;
            background: white; border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex; flex-direction: column;
        }
        @media (max-width: 768px) {
            .game-wrapper { height: 100vh; width: 100vw; border-radius: 0; }
        }

        canvas { flex: 1; touch-action: none; cursor: crosshair; }
        
        .side-buttons { position: absolute; top: 15px; right: 15px; z-index: 10; display: flex; gap: 8px; }
        .btn-game { padding: 8px 16px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: white; font-size: 12px; }
        .btn-setup { background-color: #4ecdc4; }
        .btn-home { background-color: #667eea; }

        .popup-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8); display: flex; align-items: center;
            justify-content: center; z-index: 1000;
        }
        .popup-content {
            background: white; border-radius: 25px; padding: 40px;
            max-width: 500px; width: 90%; text-align: center;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .popup-emoji { font-size: 60px; }
        .popup-image { width: 100%; height: 200px; object-fit: cover; border-radius: 15px; margin: 15px 0; }
        .popup-btn { 
            width: 100%; padding: 15px; background: #667eea; 
            color: white; border: none; border-radius: 10px; 
            font-size: 18px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const SoundManager = {
            ctx: null,
            init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            play(freq, duration = 0.1) {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + duration);
            },
            playCollision() { this.play(400, 0.05); },
            playHole() {
                this.init();
                [523, 659, 783].forEach((f, i) => {
                    setTimeout(() => this.play(f, 0.15), i * 100);
                });
            }
        };

        function CurlingApp() {
            const [page, setPage] = useState('home');
            const [layers, setLayers] = useState(Array(6).fill(null).map((_, i) => ({
                id: i, emoji: '🎯', title: `목표 ${i + 1}`, text: `축하합니다! ${i+1}번 과녁에 명중했습니다.`, image: ''
            })));

            const updateLayer = (idx, field, val) => {
                const next = [...layers];
                next[idx] = { ...next[idx], [field]: val };
                setLayers(next);
            };

            return (
                <div style={{width: '100%'}}>
                    {page === 'home' && <Home onStart={() => setPage('setup')} />}
                    {page === 'setup' && (
                        <Setup 
                            layers={layers} 
                            onUpdate={updateLayer} 
                            onBack={() => setPage('home')} 
                            onPlay={() => setPage('game')} 
                        />
                    )}
                    {page === 'game' && <Game layers={layers} onExit={() => setPage('setup')} onHome={() => setPage('home')} />}
                </div>
            );
        }

        function Home({ onStart }) {
            return (
                <div className="home-container">
                    <h1 className="home-title">🎯 프로 컬링 게임</h1>
                    <p>스톤을 던져 목표를 달성하세요!</p>
                    <div className="mode-grid">
                        <div className="mode-card" onClick={onStart}><h2>시작하기</h2><p>목표 설정 및 게임 실행</p></div>
                        <div className="mode-card" style={{opacity: 0.6}}><h2>대결모드</h2><p>준비 중입니다</p></div>
                    </div>
                </div>
            );
        }

        function Setup({ layers, onUpdate, onBack, onPlay }) {
            return (
                <div className="setup-container">
                    <div className="setup-header">
                        <h2>⚙️ 게임 설정</h2>
                        <div>
                            <button className="btn-game btn-home" onClick={onBack} style={{marginRight:'10px'}}>홈으로</button>
                            <button className="btn-game btn-setup" onClick={onPlay} style={{background:'#764ba2'}}>게임 시작!</button>
                        </div>
                    </div>
                    <div className="layers-grid">
                        {layers.map((l, i) => (
                            <div key={i} className="layer-card">
                                <h3>과녁 #{i+1}</h3>
                                <div className="form-group">
                                    <label className="form-label">제목</label>
                                    <input type="text" value={l.title} onChange={e => onUpdate(i, 'title', e.target.value)} />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">설명</label>
                                    <textarea value={l.text} onChange={e => onUpdate(i, 'text', e.target.value)} />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">이미지 업로드</label>
                                    <input type="file" accept="image/*" onChange={e => {
                                        const file = e.target.files[0];
                                        if(file) {
                                            const reader = new FileReader();
                                            reader.onload = (ev) => onUpdate(i, 'image', ev.target.result);
                                            reader.readAsDataURL(file);
                                        }
                                    }} />
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function Game({ layers, onExit, onHome }) {
            const canvasRef = useRef(null);
            const wrapperRef = useRef(null);
            const [popup, setPopup] = useState(null);
            
            const state = useRef({
                stone: { x: 0, y: 0, vx: 0, vy: 0, r: 20 },
                drag: { active: false, startX: 0, startY: 0, currX: 0, currY: 0 },
                holes: [],
                isMoving: false,
                canvasWidth: 0,
                canvasHeight: 0,
                padding: 20 // padding을 state에 포함시켜 어디서든 참조 가능하게 수정
            });

            const resize = () => {
                const canvas = canvasRef.current;
                const wrapper = wrapperRef.current;
                if (!canvas || !wrapper) return;

                const parentHeight = wrapper.clientHeight;
                let canvasHeight = parentHeight;
                let canvasWidth = canvasHeight / 2.5;

                if (canvasWidth > window.innerWidth * 0.9) {
                    canvasWidth = window.innerWidth * 0.9;
                    canvasHeight = canvasWidth * 2.5;
                }

                canvas.width = canvasWidth;
                canvas.height = canvasHeight;
                wrapper.style.width = `${canvasWidth}px`;

                state.current.canvasWidth = canvasWidth;
                state.current.canvasHeight = canvasHeight;

                state.current.stone.x = canvasWidth / 2;
                state.current.stone.y = canvasHeight - 120;

                const newHoles = [];
                const padding = state.current.padding;
                const startY = padding + 60;
                const colSpacing = (canvasWidth - padding * 2) / 2;
                const rowSpacing = 80;

                for(let i=0; i<6; i++) {
                    const row = Math.floor(i / 2);
                    const col = i % 2;
                    newHoles.push({
                        x: padding + colSpacing / 2 + col * colSpacing,
                        y: startY + row * rowSpacing,
                        r: 30,
                        index: i
                    });
                }
                state.current.holes = newHoles;
            };

            const resetStone = (toStartLine = true) => {
                const s = state.current.stone;
                s.vx = 0; s.vy = 0;
                if(toStartLine) {
                    s.x = state.current.canvasWidth / 2;
                    s.y = state.current.canvasHeight - 120;
                }
            };

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationId;

                window.addEventListener('resize', resize);
                resize();

                const loop = () => {
                    update();
                    draw();
                    animationId = requestAnimationFrame(loop);
                };

                const update = () => {
                    const s = state.current.stone;
                    const cW = state.current.canvasWidth;
                    const cH = state.current.canvasHeight;

                    if (state.current.isMoving) {
                        s.x += s.vx;
                        s.y += s.vy;
                        s.vx *= 0.985;
                        s.vy *= 0.985;

                        if(s.x < s.r || s.x > cW - s.r) { s.vx *= -0.7; s.x = s.x < s.r ? s.r : cW - s.r; SoundManager.playCollision(); }
                        if(s.y < s.r || s.y > cH - s.r) { s.vy *= -0.7; s.y = s.y < s.r ? s.r : cH - s.r; SoundManager.playCollision(); }

                        if(Math.hypot(s.vx, s.vy) < 0.2) {
                            state.current.isMoving = false;
                            const hit = state.current.holes.find(h => {
                                const dist = Math.hypot(s.x - h.x, s.y - h.y);
                                return dist < h.r + s.r;
                            });

                            if(hit) {
                                SoundManager.playHole();
                                setPopup(layers[hit.index]);
                                resetStone(false);
                            } else {
                                resetStone(true);
                            }
                        }
                    }
                };

                const draw = () => {
                    const cH = state.current.canvasHeight;
                    const cW = state.current.canvasWidth;
                    const padding = state.current.padding; // state에서 안전하게 참조
                    ctx.clearRect(0, 0, cW, cH);
                    
                    const grad = ctx.createLinearGradient(0,0,0, cH);
                    grad.addColorStop(0, '#f0faff'); grad.addColorStop(1, '#d0eaff');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0,0, cW, cH);

                    ctx.save();
                    ctx.strokeStyle = '#c0d0e0';
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([5, 10]);

                    ctx.beginPath();
                    ctx.moveTo(cW/2, 20); ctx.lineTo(cW/2, cH-20); ctx.stroke();
                    
                    const startLineY = cH - 150;
                    ctx.beginPath();
                    ctx.moveTo(10, startLineY); ctx.lineTo(cW-10, startLineY); ctx.stroke();
                    
                    ctx.setLineDash([]);
                    ctx.fillStyle = 'rgba(200, 210, 220, 0.4)';
                    ctx.fillRect(10, startLineY, cW-20, 80);

                    ctx.fillStyle = '#ff6b6b';
                    ctx.font = 'bold 16px Sans-serif';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('START', padding + 15, startLineY + 25);
                    ctx.restore();

                    state.current.holes.forEach((h, i) => {
                        ctx.beginPath();
                        ctx.arc(h.x, h.y, h.r, 0, Math.PI*2);
                        ctx.fillStyle = '#1a1a1a';
                        ctx.fill();
                        ctx.strokeStyle = '#ff4757';
                        ctx.lineWidth = 4;
                        ctx.stroke();
                        
                        ctx.fillStyle = 'white';
                        ctx.font = 'bold 24px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(i+1, h.x, h.y);
                        
                        ctx.fillStyle = '#444';
                        ctx.font = '14px Sans-serif';
                        ctx.fillText(layers[i].title, h.x, h.y + h.r + 20);
                    });

                    if(state.current.drag.active) {
                        const d = state.current.drag;
                        const s = state.current.stone;
                        ctx.beginPath();
                        ctx.moveTo(s.x, s.y);
                        ctx.lineTo(d.currX, d.currY);
                        ctx.strokeStyle = 'rgba(255, 100, 100, 0.5)';
                        ctx.lineWidth = 2;
                        ctx.setLineDash([5, 5]);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }

                    const s = state.current.stone;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
                    const sGrad = ctx.createRadialGradient(s.x-5, s.y-5, 0, s.x, s.y, s.r);
                    sGrad.addColorStop(0, '#ff9c5b'); sGrad.addColorStop(1, '#d93c3c');
                    ctx.fillStyle = sGrad;
                    ctx.fill();
                    ctx.strokeStyle = '#c41e3a';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                };

                const onDown = (e) => {
                    if(state.current.isMoving || popup) return;
                    const rect = canvas.getBoundingClientRect();
                    const clientX = e.clientX || e.touches[0].clientX;
                    const clientY = e.clientY || e.touches[0].clientY;
                    
                    const x = (clientX - rect.left) * (canvas.width / rect.width);
                    const y = (clientY - rect.top) * (canvas.height / rect.height);
                    
                    const s = state.current.stone;
                    if(Math.hypot(x - s.x, y - s.y) < s.r * 2.5) {
                        state.current.drag.active = true;
                        state.current.drag.startX = x;
                        state.current.drag.startY = y;
                        state.current.drag.currX = x;
                        state.current.drag.currY = y;
                        SoundManager.play(800, 0.05);
                    }
                };

                const onMove = (e) => {
                    if(!state.current.drag.active || popup) return;
                    const rect = canvas.getBoundingClientRect();
                    const scaleX = canvas.width / rect.width;
                    const scaleY = canvas.height / rect.height;

                    const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
                    const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);

                    state.current.drag.currX = (clientX - rect.left) * scaleX;
                    state.current.drag.currY = (clientY - rect.top) * scaleY;
                };

                const onUp = (e) => {
                    if(!state.current.drag.active || popup) return;
                    const s = state.current.stone;
                    const d = state.current.drag;
                    
                    const dx = d.startX - d.currX;
                    const dy = d.startY - d.currY;
                    
                    const powerLimit = state.current.canvasHeight / 12;
                    s.vx = dx * 0.15;
                    s.vy = dy * 0.15;
                    
                    if(Math.hypot(s.vx, s.vy) > 1.5) {
                        state.current.isMoving = true;
                        SoundManager.play(600, 0.2);
                    } else {
                        resetStone(true);
                    }
                    state.current.drag.active = false;
                };

                canvas.addEventListener('mousedown', onDown);
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
                canvas.addEventListener('touchstart', onDown, { passive: false });
                window.addEventListener('touchmove', onMove, { passive: false });
                window.addEventListener('touchend', onUp);

                loop();

                return () => {
                    cancelAnimationFrame(animationId);
                    window.removeEventListener('resize', resize);
                    canvas.removeEventListener('mousedown', onDown);
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                    canvas.removeEventListener('touchstart', onDown);
                    window.removeEventListener('touchmove', onMove);
                    window.removeEventListener('touchend', onUp);
                };
            }, [layers]);

            const closePopup = () => {
                setPopup(null);
                resetStone(true);
            };

            return (
                <div className="game-wrapper" ref={wrapperRef}>
                    <div className="side-buttons">
                        <button className="btn-game btn-setup" onClick={onExit}>⚙️ 설정</button>
                        <button className="btn-game btn-home" onClick={onHome}>🏠 홈</button>
                    </div>
                    <canvas ref={canvasRef} />
                    
                    {popup && (
                        <div className="popup-overlay">
                            <div className="popup-content">
                                <div className="popup-emoji">{popup.emoji}</div>
                                <h1>{popup.title}</h1>
                                {popup.image && <img src={popup.image} className="popup-image" />}
                                <p style={{margin:'20px 0', lineHeight:'1.6'}}>{popup.text}</p>
                                <button className="popup-btn" onClick={closePopup}>확인</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<CurlingApp />, document.getElementById('root'));
    </script>
</body>
</html>
