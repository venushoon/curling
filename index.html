<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 프로 컬링 게임</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ==================== 설정 페이지 ==================== */
        .setup-container {
            width: 100%;
            max-width: 1000px;
            background: white;
            border-radius: 25px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .setup-title {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-align: center;
        }

        .setup-subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 40px;
            font-size: 16px;
        }

        .layers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .layer-card {
            background: #f8f9ff;
            border: 3px solid #e0e7ff;
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s;
        }

        .layer-card:hover {
            border-color: #667eea;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
            transform: translateY(-5px);
        }

        .layer-number {
            font-size: 32px;
            font-weight: 900;
            color: #667eea;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            font-weight: 700;
            font-size: 12px;
            color: #667eea;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="file"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e7ff;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s;
        }

        input[type="text"]:focus,
        input[type="file"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .preview-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 10px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }

        .btn {
            flex: 1;
            padding: 16px 32px;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-start:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-reset {
            background: white;
            color: #667eea;
            border: 3px solid #667eea;
        }

        .btn-reset:hover {
            background: #f8f9ff;
        }

        /* ==================== 게임 페이지 ==================== */
        .game-container {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            background: linear-gradient(to bottom, #2c3e50 0%, #34495e 100%);
            display: flex;
            flex-direction: column;
            animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .game-header {
            padding: 20px;
            text-align: center;
            color: white;
            font-weight: 700;
            font-size: 18px;
            border-bottom: 3px solid rgba(255, 255, 255, 0.1);
        }

        .canvas-container {
            flex: 1;
            position: relative;
            background: linear-gradient(to bottom, #2c3e50 0%, #1a252f 100%);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .game-controls {
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            gap: 10px;
            border-top: 3px solid rgba(255, 255, 255, 0.1);
        }

        .btn-game {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .btn-restart {
            background: #ff6b6b;
            color: white;
        }

        .btn-restart:hover {
            background: #ff5252;
            transform: scale(1.05);
        }

        .btn-setup {
            background: #4ecdc4;
            color: white;
        }

        .btn-setup:hover {
            background: #45b7d1;
            transform: scale(1.05);
        }

        /* ==================== 팝업 ==================== */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .popup-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.7);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .popup-emoji {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 0.6s;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .popup-title {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 15px;
            color: #667eea;
        }

        .popup-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            margin: 20px 0;
        }

        .popup-text {
            font-size: 16px;
            color: #333;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .popup-btn {
            padding: 14px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .popup-btn:hover {
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .setup-container {
                padding: 30px;
            }

            .layers-grid {
                grid-template-columns: 1fr;
            }

            .setup-title {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // 사운드 유틸리티
        const SoundManager = {
            audioContext: null,

            init() {
                if (!this.audioContext) {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
            },

            playDrag() {
                this.init();
                const ctx = this.audioContext;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 800;
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.1);
            },

            playCollision() {
                this.init();
                const ctx = this.audioContext;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.05);
            },

            playHole() {
                this.init();
                const ctx = this.audioContext;
                const notes = [523.25, 659.25, 783.99];
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.1, ctx.currentTime + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.08 + 0.15);
                    osc.start(ctx.currentTime + i * 0.08);
                    osc.stop(ctx.currentTime + i * 0.08 + 0.15);
                });
            }
        };

        function CurlingGame() {
            const [gameState, setGameState] = useState('setup'); // 'setup' or 'playing'
            const [layers, setLayers] = useState(Array(6).fill(null).map((_, i) => ({
                id: i,
                emoji: '🎯',
                title: `레이어 ${i + 1}`,
                text: `목표 ${i + 1}`,
                image: ''
            })));

            const handleLayerChange = (index, field, value) => {
                setLayers(prev => {
                    const newLayers = [...prev];
                    newLayers[index] = { ...newLayers[index], [field]: value };
                    return newLayers;
                });
            };

            const handleImageUpload = (index, file) => {
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        handleLayerChange(index, 'image', e.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const startGame = () => {
                SoundManager.playDrag();
                setGameState('playing');
            };

            const resetGame = () => {
                setGameState('setup');
            };

            if (gameState === 'setup') {
                return (
                    <div className="setup-container">
                        <h1 className="setup-title">🎯 컬링 게임 설정</h1>
                        <p className="setup-subtitle">6개의 목표를 설정하고 게임을 시작하세요</p>

                        <div className="layers-grid">
                            {layers.map((layer, index) => (
                                <div key={index} className="layer-card">
                                    <div className="layer-number">#{index + 1}</div>

                                    <div className="form-group">
                                        <label className="form-label">이모지</label>
                                        <input
                                            type="text"
                                            value={layer.emoji}
                                            onChange={(e) => handleLayerChange(index, 'emoji', e.target.value.slice(0, 2))}
                                            maxLength="2"
                                            style={{ textAlign: 'center', fontSize: '24px' }}
                                        />
                                    </div>

                                    <div className="form-group">
                                        <label className="form-label">제목</label>
                                        <input
                                            type="text"
                                            value={layer.title}
                                            onChange={(e) => handleLayerChange(index, 'title', e.target.value)}
                                            placeholder="목표 제목"
                                        />
                                    </div>

                                    <div className="form-group">
                                        <label className="form-label">설명</label>
                                        <textarea
                                            value={layer.text}
                                            onChange={(e) => handleLayerChange(index, 'text', e.target.value)}
                                            placeholder="목표 설명"
                                        />
                                    </div>

                                    <div className="form-group">
                                        <label className="form-label">이미지</label>
                                        <input
                                            type="file"
                                            accept="image/*"
                                            onChange={(e) => handleImageUpload(index, e.target.files?.[0])}
                                        />
                                        {layer.image && (
                                            <img src={layer.image} alt="preview" className="preview-image" />
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="button-group">
                            <button className="btn btn-start" onClick={startGame}>🎮 게임 시작</button>
                        </div>
                    </div>
                );
            }

            return <GameScreen layers={layers} onReset={resetGame} />;
        }

        function GameScreen({ layers, onReset }) {
            const canvasRef = useRef(null);
            const [stonePos, setStonePos] = useState({ x: 250, y: 50 });
            const [stoneVel, setStoneVel] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);
            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
            const [showPopup, setShowPopup] = useState(false);
            const [popupData, setPopupData] = useState(null);
            const [wallCollisions, setWallCollisions] = useState(0);

            const STONE_RADIUS = 12;
            const HOLE_RADIUS = 35;
            const HOLES = [
                { x: 250, y: 550 },
                { x: 150, y: 500 },
                { x: 350, y: 500 },
                { x: 100, y: 400 },
                { x: 250, y: 400 },
                { x: 400, y: 400 }
            ];

            // 캔버스 그리기
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                const width = canvas.clientWidth;
                const height = canvas.clientHeight;
                canvas.width = width;
                canvas.height = height;

                // 배경
                const bgGradient = ctx.createLinearGradient(0, 0, width, height);
                bgGradient.addColorStop(0, '#2c3e50');
                bgGradient.addColorStop(1, '#1a252f');
                ctx.fillStyle = bgGradient;
                ctx.fillRect(0, 0, width, height);

                // 컬링장 경계선
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 2;
                ctx.strokeRect(50, 20, width - 100, height - 40);

                // 중심선
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(width / 2, 20);
                ctx.lineTo(width / 2, height - 20);
                ctx.stroke();
                ctx.setLineDash([]);

                // 구멍 그리기
                HOLES.forEach((hole, idx) => {
                    // 그림자
                    const shadowGradient = ctx.createRadialGradient(hole.x, hole.y, 0, hole.x, hole.y, HOLE_RADIUS);
                    shadowGradient.addColorStop(0, 'rgba(0, 0, 0, 0.3)');
                    shadowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    ctx.fillStyle = shadowGradient;
                    ctx.fillRect(hole.x - HOLE_RADIUS - 5, hole.y - HOLE_RADIUS - 5, (HOLE_RADIUS + 5) * 2, (HOLE_RADIUS + 5) * 2);

                    // 구멍
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(hole.x, hole.y, HOLE_RADIUS, 0, Math.PI * 2);
                    ctx.fill();

                    // 구멍 테두리
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // 번호
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(`${idx + 1}`, hole.x, hole.y);
                });

                // 컬링 돌 그리기
                const stoneGradient = ctx.createRadialGradient(stonePos.x - 4, stonePos.y - 4, 2, stonePos.x, stonePos.y, STONE_RADIUS);
                stoneGradient.addColorStop(0, '#ff8c42');
                stoneGradient.addColorStop(0.5, '#ff6b35');
                stoneGradient.addColorStop(1, '#c41e3a');

                ctx.fillStyle = stoneGradient;
                ctx.beginPath();
                ctx.arc(stonePos.x, stonePos.y, STONE_RADIUS, 0, Math.PI * 2);
                ctx.fill();

                // 돌 하이라이트
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(stonePos.x - 4, stonePos.y - 4, 4, 0, Math.PI * 2);
                ctx.fill();

                // 돌 테두리
                ctx.strokeStyle = 'rgba(196, 30, 58, 0.8)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 드래그 시 궤적 표시
                if (isDragging) {
                    ctx.strokeStyle = 'rgba(255, 200, 100, 0.5)';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.moveTo(stonePos.x, stonePos.y);
                    ctx.lineTo(dragStart.x, dragStart.y);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // 힘 표시
                    const dx = dragStart.x - stonePos.x;
                    const dy = dragStart.y - stonePos.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    ctx.fillStyle = 'rgba(255, 200, 100, 0.6)';
                    ctx.font = 'bold 14px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`POWER: ${Math.round(distance / 2)}%`, stonePos.x, stonePos.y - 30);
                }

            }, [stonePos, isDragging, dragStart]);

            // 마우스 이벤트
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;

                const getCoords = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    return {
                        x: (clientX - rect.left) * (canvas.width / rect.width),
                        y: (clientY - rect.top) * (canvas.height / rect.height)
                    };
                };

                const handleStart = (e) => {
                    const coords = getCoords(e);
                    const dx = coords.x - stonePos.x;
                    const dy = coords.y - stonePos.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < STONE_RADIUS * 3 && Math.abs(stoneVel.x) < 1 && Math.abs(stoneVel.y) < 1) {
                        setIsDragging(true);
                        setDragStart(coords);
                        SoundManager.playDrag();
                    }
                };

                const handleMove = (e) => {
                    if (isDragging) {
                        setDragStart(getCoords(e));
                    }
                };

                const handleEnd = () => {
                    if (isDragging) {
                        const dx = dragStart.x - stonePos.x;
                        const dy = dragStart.y - stonePos.y;
                        const power = Math.sqrt(dx * dx + dy * dy);

                        if (power > 10) {
                            const angle = Math.atan2(dy, dx);
                            const velocity = Math.min(power * 0.6, 25);
                            setStoneVel({
                                x: Math.cos(angle) * velocity,
                                y: Math.sin(angle) * velocity
                            });
                            SoundManager.playDrag();
                        }
                        setIsDragging(false);
                    }
                };

                canvas.addEventListener('mousedown', handleStart);
                canvas.addEventListener('mousemove', handleMove);
                canvas.addEventListener('mouseup', handleEnd);
                canvas.addEventListener('touchstart', handleStart);
                canvas.addEventListener('touchmove', handleMove);
                canvas.addEventListener('touchend', handleEnd);

                return () => {
                    canvas.removeEventListener('mousedown', handleStart);
                    canvas.removeEventListener('mousemove', handleMove);
                    canvas.removeEventListener('mouseup', handleEnd);
                    canvas.removeEventListener('touchstart', handleStart);
                    canvas.removeEventListener('touchmove', handleMove);
                    canvas.removeEventListener('touchend', handleEnd);
                };
            }, [stonePos, isDragging, dragStart, stoneVel]);

            // 물리 시뮬레이션
            useEffect(() => {
                const interval = setInterval(() => {
                    setStonePos(prev => {
                        setStoneVel(vel => {
                            let newVel = { ...vel };
                            const canvas = canvasRef.current;
                            if (!canvas) return newVel;

                            let newX = prev.x + newVel.x;
                            let newY = prev.y + newVel.y;

                            const width = canvas.width;
                            const height = canvas.height;
                            const margin = 50;

                            // 벽 충돌 (당구처럼 반사)
                            if (newX - STONE_RADIUS < margin) {
                                newX = margin + STONE_RADIUS;
                                newVel.x = -newVel.x * 0.8;
                                SoundManager.playCollision();
                            }
                            if (newX + STONE_RADIUS > width - margin) {
                                newX = width - margin - STONE_RADIUS;
                                newVel.x = -newVel.x * 0.8;
                                SoundManager.playCollision();
                            }
                            if (newY - STONE_RADIUS < 20) {
                                newY = 20 + STONE_RADIUS;
                                newVel.y = -newVel.y * 0.8;
                                SoundManager.playCollision();
                            }
                            if (newY + STONE_RADIUS > height - 20) {
                                newY = height - 20 - STONE_RADIUS;
                                newVel.y = -newVel.y * 0.8;
                                SoundManager.playCollision();
                            }

                            // 구멍 충돌 감지
                            HOLES.forEach((hole, idx) => {
                                const dx = newX - hole.x;
                                const dy = newY - hole.y;
                                const distance = Math.sqrt(dx * dx + dy * dy);

                                if (distance < HOLE_RADIUS) {
                                    SoundManager.playHole();
                                    setShowPopup(true);
                                    setPopupData(layers[idx]);
                                    newX = prev.x;
                                    newY = prev.y;
                                    newVel = { x: 0, y: 0 };
                                }
                            });

                            // 마찰 계산
                            newVel.x *= 0.98;
                            newVel.y *= 0.98;

                            if (Math.abs(newVel.x) < 0.1) newVel.x = 0;
                            if (Math.abs(newVel.y) < 0.1) newVel.y = 0;

                            setStonePos({ x: newX, y: newY });
                            return newVel;
                        });

                        return prev;
                    });
                }, 30);

                return () => clearInterval(interval);
            }, [layers]);

            return (
                <div className="game-container">
                    <div className="game-header">🎯 컬링 게임 | 컬링돌을 드래그해서 구멍에 넣으세요!</div>
                    
                    <div className="canvas-container">
                        <canvas ref={canvasRef}></canvas>
                    </div>

                    <div className="game-controls">
                        <button className="btn-game btn-restart" onClick={() => {
                            setStonePos({ x: 250, y: 50 });
                            setStoneVel({ x: 0, y: 0 });
                            SoundManager.playDrag();
                        }}>↺ 다시하기</button>
                        <button className="btn-game btn-setup" onClick={onReset}>⚙️ 설정</button>
                    </div>

                    {showPopup && popupData && (
                        <div className="popup-overlay" onClick={() => setShowPopup(false)}>
                            <div className="popup-content">
                                <div className="popup-emoji">{popupData.emoji}</div>
                                <h2 className="popup-title">{popupData.title}</h2>
                                {popupData.image && (
                                    <img src={popupData.image} alt="result" className="popup-image" />
                                )}
                                <p className="popup-text">{popupData.text}</p>
                                <button className="popup-btn" onClick={() => setShowPopup(false)}>
                                    🎮 계속하기
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<CurlingGame />, document.getElementById('root'));
    </script>
</body>
</html>
