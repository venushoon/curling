<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 프로 컬링 게임 - 개선판</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 홈 화면 */
        .home-container {
            width: 100%; max-width: 600px;
            background: white; border-radius: 30px;
            padding: 60px 40px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .home-title {
            font-size: 48px; font-weight: 900; margin-bottom: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 40px; }
        .mode-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 40px 20px; border-radius: 20px;
            cursor: pointer; transition: all 0.3s;
        }
        .mode-card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(102,126,234,0.4); }

        /* 설정 페이지 */
        .setup-container {
            width: 95vw; max-width: 1000px; max-height: 90vh;
            background: white; border-radius: 25px; padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow-y: auto;
        }
        .setup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 3px solid #e0e7ff; padding-bottom: 20px; }
        .layers-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .layer-card { background: #f8f9ff; border: 2px solid #e0e7ff; border-radius: 15px; padding: 15px; }
        .form-group { margin-bottom: 10px; }
        .form-label { font-size: 11px; font-weight: bold; color: #667eea; }
        input[type="text"], textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px; }

        /* 게임 화면 */
        .game-wrapper {
            width: 100vw; height: 100vh; position: relative;
            background: #c9e4f0; display: flex; flex-direction: column;
        }
        canvas { flex: 1; touch-action: none; cursor: crosshair; }
        .side-buttons { position: absolute; top: 20px; right: 20px; z-index: 10; display: flex; gap: 10px; }
        .btn-game { padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: white; }
        .btn-setup { background: #4ecdc4; }
        .btn-home { background: #667eea; }

        /* 팝업 */
        .popup-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8); display: flex; align-items: center;
            justify-content: center; z-index: 1000;
        }
        .popup-content {
            background: white; border-radius: 25px; padding: 40px;
            max-width: 500px; width: 90%; text-align: center;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .popup-emoji { font-size: 60px; }
        .popup-image { width: 100%; height: 200px; object-fit: cover; border-radius: 15px; margin: 15px 0; }
        .popup-btn { 
            width: 100%; padding: 15px; background: #667eea; 
            color: white; border: none; border-radius: 10px; 
            font-size: 18px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useMemo } = React;

        // 사운드 관리
        const Sound = {
            ctx: null,
            init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            play(freq, type = 'sine', duration = 0.1) {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + duration);
            }
        };

        function CurlingApp() {
            const [page, setPage] = useState('home');
            const [layers, setLayers] = useState(Array(6).fill(null).map((_, i) => ({
                id: i, emoji: '🎯', title: `목표 ${i + 1}`, text: `축하합니다! ${i+1}번 과녁에 명중했습니다.`, image: ''
            })));

            const updateLayer = (idx, field, val) => {
                const next = [...layers];
                next[idx] = { ...next[idx], [field]: val };
                setLayers(next);
            };

            return (
                <div style={{width: '100%'}}>
                    {page === 'home' && <Home onStart={() => setPage('setup')} />}
                    {page === 'setup' && (
                        <Setup 
                            layers={layers} 
                            onUpdate={updateLayer} 
                            onBack={() => setPage('home')} 
                            onPlay={() => setPage('game')} 
                        />
                    )}
                    {page === 'game' && <Game layers={layers} onExit={() => setPage('setup')} onHome={() => setPage('home')} />}
                </div>
            );
        }

        function Home({ onStart }) {
            return (
                <div className="home-container">
                    <h1 className="home-title">🎯 프로 컬링 게임</h1>
                    <p>스톤을 던져 목표를 달성하세요!</p>
                    <div className="mode-grid">
                        <div className="mode-card" onClick={onStart}><h2>시작하기</h2><p>목표 설정 및 게임 실행</p></div>
                        <div className="mode-card" style={{opacity: 0.6}}><h2>대결모드</h2><p>준비 중입니다</p></div>
                    </div>
                </div>
            );
        }

        function Setup({ layers, onUpdate, onBack, onPlay }) {
            return (
                <div className="setup-container">
                    <div className="setup-header">
                        <h2>⚙️ 게임 설정</h2>
                        <div>
                            <button className="btn-game btn-home" onClick={onBack} style={{marginRight:'10px'}}>홈으로</button>
                            <button className="btn-game btn-setup" onClick={onPlay} style={{background:'#764ba2'}}>게임 시작!</button>
                        </div>
                    </div>
                    <div className="layers-grid">
                        {layers.map((l, i) => (
                            <div key={i} className="layer-card">
                                <h3>과녁 #{i+1}</h3>
                                <div className="form-group">
                                    <label className="form-label">제목</label>
                                    <input type="text" value={l.title} onChange={e => onUpdate(i, 'title', e.target.value)} />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">설명</label>
                                    <textarea value={l.text} onChange={e => onUpdate(i, 'text', e.target.value)} />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">이미지 업로드</label>
                                    <input type="file" accept="image/*" onChange={e => {
                                        const file = e.target.files[0];
                                        if(file) {
                                            const reader = new FileReader();
                                            reader.onload = (ev) => onUpdate(i, 'image', ev.target.result);
                                            reader.readAsDataURL(file);
                                        }
                                    }} />
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function Game({ layers, onExit, onHome }) {
            const canvasRef = useRef(null);
            const [popup, setPopup] = useState(null);
            
            // 게임 상태 관리 (ref를 사용하여 리렌더링 없이 물리엔진 구동)
            const state = useRef({
                stone: { x: 0, y: 0, vx: 0, vy: 0, r: 25 },
                drag: { active: false, startX: 0, startY: 0, currX: 0, currY: 0 },
                holes: [],
                images: [],
                isMoving: false
            });

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationId;

                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    // 스톤 초기 위치
                    state.current.stone.x = canvas.width / 2;
                    state.current.stone.y = canvas.height - 100;
                    // 구멍 위치 재계산
                    const cols = 2;
                    const rows = 3;
                    const newHoles = [];
                    for(let i=0; i<6; i++) {
                        const r = Math.floor(i / cols);
                        const c = i % cols;
                        newHoles.push({
                            x: canvas.width * (c === 0 ? 0.25 : 0.75),
                            y: 150 + r * 150,
                            r: 50,
                            index: i
                        });
                    }
                    state.current.holes = newHoles;
                };

                // 이미지 미리 로드
                layers.forEach((l, i) => {
                    if(l.image) {
                        const img = new Image();
                        img.src = l.image;
                        state.current.images[i] = img;
                    }
                });

                window.addEventListener('resize', resize);
                resize();

                const loop = () => {
                    update();
                    draw();
                    animationId = requestAnimationFrame(loop);
                };

                const update = () => {
                    const s = state.current.stone;
                    if (state.current.isMoving) {
                        s.x += s.vx;
                        s.y += s.vy;
                        s.vx *= 0.98; // 마찰력
                        s.vy *= 0.98;

                        // 벽 충돌
                        if(s.x < s.r || s.x > canvas.width - s.r) { s.vx *= -0.7; s.x = s.x < s.r ? s.r : canvas.width - s.r; Sound.play(200); }
                        if(s.y < s.r || s.y > canvas.height - s.r) { s.vy *= -0.7; s.y = s.y < s.r ? s.r : canvas.height - s.r; Sound.play(200); }

                        // 정지 확인
                        if(Math.abs(s.vx) + Math.abs(s.vy) < 0.2) {
                            s.vx = 0; s.vy = 0;
                            state.current.isMoving = false;
                            
                            // 과녁 명중 확인
                            const hit = state.current.holes.find(h => {
                                const dist = Math.hypot(s.x - h.x, s.y - h.y);
                                return dist < h.r + s.r;
                            });

                            if(hit) {
                                Sound.play(600, 'triangle', 0.3);
                                setPopup(layers[hit.index]);
                            } else {
                                // 못 넣었으면 원위치
                                s.x = canvas.width / 2;
                                s.y = canvas.height - 100;
                            }
                        }
                    }
                };

                const draw = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    // 배경 (아이스)
                    const grad = ctx.createLinearGradient(0,0,0, canvas.height);
                    grad.addColorStop(0, '#eef2f3'); grad.addColorStop(1, '#8e9eab');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0,0, canvas.width, canvas.height);

                    // 과녁 그리기
                    state.current.holes.forEach((h, i) => {
                        ctx.beginPath();
                        ctx.arc(h.x, h.y, h.r, 0, Math.PI*2);
                        ctx.fillStyle = '#1a1a1a';
                        ctx.fill();
                        ctx.strokeStyle = '#ff4757';
                        ctx.lineWidth = 5;
                        ctx.stroke();
                        
                        // 과녁 이미지 or 숫자
                        const img = state.current.images[i];
                        if(img) {
                            ctx.save();
                            ctx.beginPath(); ctx.arc(h.x, h.y, h.r-5, 0, Math.PI*2); ctx.clip();
                            ctx.drawImage(img, h.x - h.r, h.y - h.r, h.r*2, h.r*2);
                            ctx.restore();
                        } else {
                            ctx.fillStyle = 'white';
                            ctx.font = 'bold 30px Arial';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(i+1, h.x, h.y);
                        }
                        
                        // 과녁 제목
                        ctx.fillStyle = '#333';
                        ctx.font = 'bold 16px Sans-serif';
                        ctx.fillText(layers[i].title, h.x, h.y + h.r + 25);
                    });

                    // 드래그 가이드 라인
                    if(state.current.drag.active) {
                        const d = state.current.drag;
                        ctx.beginPath();
                        ctx.moveTo(state.current.stone.x, state.current.stone.y);
                        ctx.lineTo(d.currX, d.currY);
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                        ctx.setLineDash([5, 5]);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }

                    // 스톤 그리기
                    const s = state.current.stone;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
                    const sGrad = ctx.createRadialGradient(s.x-5, s.y-5, 0, s.x, s.y, s.r);
                    sGrad.addColorStop(0, '#ff9c5b'); sGrad.addColorStop(1, '#d93c3c');
                    ctx.fillStyle = sGrad;
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                };

                const onDown = (e) => {
                    if(state.current.isMoving) return;
                    const x = e.clientX || e.touches[0].clientX;
                    const y = e.clientY || e.touches[0].clientY;
                    const s = state.current.stone;
                    if(Math.hypot(x - s.x, y - s.y) < s.r * 2) {
                        state.current.drag.active = true;
                        state.current.drag.startX = x;
                        state.current.drag.startY = y;
                        state.current.drag.currX = x;
                        state.current.drag.currY = y;
                        Sound.play(400);
                    }
                };

                const onMove = (e) => {
                    if(!state.current.drag.active) return;
                    state.current.drag.currX = e.clientX || e.touches?.[0].clientX;
                    state.current.drag.currY = e.clientY || e.touches?.[0].clientY;
                };

                const onUp = () => {
                    if(!state.current.drag.active) return;
                    const d = state.current.drag;
                    const dx = state.current.stone.x - d.currX;
                    const dy = state.current.stone.y - d.currY;
                    
                    state.current.stone.vx = dx * 0.15;
                    state.current.stone.vy = dy * 0.15;
                    state.current.isMoving = true;
                    state.current.drag.active = false;
                    Sound.play(800, 'sine', 0.2);
                };

                canvas.addEventListener('mousedown', onDown);
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
                canvas.addEventListener('touchstart', onDown);
                window.addEventListener('touchmove', onMove);
                window.addEventListener('touchend', onUp);

                loop();

                return () => {
                    cancelAnimationFrame(animationId);
                    window.removeEventListener('resize', resize);
                    canvas.removeEventListener('mousedown', onDown);
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                };
            }, [layers]);

            const closePopup = () => {
                setPopup(null);
                state.current.stone.x = canvasRef.current.width / 2;
                state.current.stone.y = canvasRef.current.height - 100;
            };

            return (
                <div className="game-wrapper">
                    <div className="side-buttons">
                        <button className="btn-game btn-setup" onClick={onExit}>⚙️ 설정</button>
                        <button className="btn-game btn-home" onClick={onHome}>🏠 홈</button>
                    </div>
                    <canvas ref={canvasRef} />
                    
                    {popup && (
                        <div className="popup-overlay">
                            <div className="popup-content">
                                <div className="popup-emoji">{popup.emoji}</div>
                                <h1>{popup.title}</h1>
                                {popup.image && <img src={popup.image} className="popup-image" />}
                                <p style={{margin:'20px 0', lineHeight:'1.6'}}>{popup.text}</p>
                                <button className="popup-btn" onClick={closePopup}>확인</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<CurlingApp />, document.getElementById('root'));
    </script>
</body>
</html>
